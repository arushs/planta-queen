<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planta Queen 🌱</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>🌱 Planta Queen</h1>
    <p class="tagline">Snap a photo — get a watering plan and reminders.</p>
    <button id="enable-notifications" class="ghost" hidden>Enable browser notifications</button>
  </header>

  <main>
    <section class="panel" id="add-panel">
      <h2>Add a plant</h2>
      <form id="add-form">
        <label>
          Name
          <input type="text" name="name" placeholder="e.g. Kitchen monstera" required />
        </label>
        <label>
          Photo
          <input type="file" name="photo" accept="image/*" capture="environment" required />
        </label>
        <button type="submit" id="add-btn">Analyze &amp; add</button>
        <p class="hint" id="add-status"></p>
      </form>
    </section>

    <section class="panel" id="notifications-panel" hidden>
      <h2>Reminders</h2>
      <ul id="notifications-list"></ul>
    </section>

    <section>
      <h2>Your plants</h2>
      <div id="plants" class="grid"></div>
      <p class="hint" id="empty-hint" hidden>No plants yet — add your first one above.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
